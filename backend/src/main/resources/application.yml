spring:
  application:
    name: dbshield-backend
  datasource:
    url: jdbc:h2:file:./dbshield;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: 8f8a15b3e945c7b949c836dbf5f4b4650f1465bc43980123567890abcdef1234
  expiration-ms: 86400000
