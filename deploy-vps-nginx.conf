limit_req_zone $binary_remote_addr zone=dbshield_api:10m rate=5r/s;
server {
    listen 80;
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/31.220.88.80/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/31.220.88.80/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location = /api/v1/auth/fix { return 404; }
    location = /api/v1/integration/query {
        limit_req zone=dbshield_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}
