name: dbshield
services:
  frontend:
    image: bdiiproyecto-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 128m
    networks: [dbshield-net]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-live:/usr/share/nginx/html:ro
      - /opt/dbshield/tls:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
  backend:
    image: bdiiproyecto-backend:latest
    restart: unless-stopped
    mem_limit: 768m
    volumes:
      - ./backend-live.jar:/app/app.jar:ro
      - proxy-events:/proxy-events
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://internal-db:5432/dbshield
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      DBSHIELD_INTERNAL_HOST: sql-proxy
      DBSHIELD_PROXY_HOST: sql-proxy
      DBSHIELD_PROXY_EVENTS_DIR: /proxy-events
      DBSHIELD_PUBLIC_HOST: 31.220.88.80
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    networks: [dbshield-net]
    depends_on:
      internal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://localhost:8080/api/v1/auth/google/config"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
  internal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: dbshield
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - internal-db-data:/var/lib/postgresql/data
    networks: [dbshield-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d dbshield"]
      interval: 5s
      timeout: 5s
      retries: 15
  sql-proxy:
    image: dbshield-sql-proxy:20261003
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:15432-15463:15432-15463"
    environment:
      UPSTREAM_HOST: internal-db
      UPSTREAM_PORT: 5432
      EVENTS_DIR: /events
    volumes:
      - proxy-events:/events
    networks: [dbshield-net]
    depends_on:
      internal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; assert time.time()-json.load(open('/events/status.json'))['timestamp']<30"]
      interval: 10s
      timeout: 5s
      retries: 3
networks:
  dbshield-net:
    driver: bridge
volumes:
  proxy-events:
  internal-db-data:
    external: true
    name: dbshield_internal-db-data
