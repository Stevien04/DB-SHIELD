version: '3.8'

services:
  # 1. FRONTEND: Interfaz de Usuario aislada
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    networks:
      - dbshield-net
    depends_on:
      - backend

  # 2. BACKEND (Antivirus/Motor): Lógica de escaneo y API
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - DBSHIELD_INTERNAL_HOST=sql-proxy
      - DBSHIELD_PROXY_HOST=sql-proxy
      - DBSHIELD_PROXY_EVENTS_DIR=/proxy-events
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://internal-db:5432/dbshield
      - SPRING_DATASOURCE_USERNAME=dbshield_user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      - JWT_SECRET=${JWT_SECRET:?Configura JWT_SECRET en .env}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      # Secretos adicionales como JWT_SECRET irían aquí
    volumes:
      - proxy-events:/proxy-events
    networks:
      - dbshield-net
    depends_on:
      internal-db:
        condition: service_healthy # Espera a que la BD esté lista

  # 3. INTERNAL-DB: Base de datos exclusiva para la administración
  internal-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=dbshield
      - POSTGRES_USER=dbshield_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - internal-db-data:/var/lib/postgresql/data
      # - ./db/init:/docker-entrypoint-initdb.d # Opcional: para scripts iniciales
    networks:
      - dbshield-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbshield_user -d dbshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  sql-proxy:
    build: ./sql-proxy
    image: dbshield-sql-proxy:20261003
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:15432-15463:15432-15463"
    environment:
      UPSTREAM_HOST: internal-db
      EVENTS_DIR: /events
    volumes:
      - proxy-events:/events
    networks:
      - dbshield-net
    depends_on:
      internal-db:
        condition: service_healthy

  # ==========================================
  # PERFIL DEMO: BDs Externas de clientes para pruebas (Postgres y MySQL)
  # Se levantan con: docker compose --profile demo up
  # ==========================================
  demo-pg:
    image: postgres:14-alpine
    profiles: ["demo"]
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=client_pg
      - POSTGRES_USER=client_user
      - POSTGRES_PASSWORD=${DEMO_DB_PASSWORD:?Configura DEMO_DB_PASSWORD en .env}
    networks:
      - dbshield-net

  demo-mysql:
    image: mysql:8.0
    profiles: ["demo"]
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=client_mysql
      - MYSQL_USER=client_user
      - MYSQL_PASSWORD=${DEMO_DB_PASSWORD:?Configura DEMO_DB_PASSWORD en .env}
      - MYSQL_ROOT_PASSWORD=${DEMO_ROOT_PASSWORD:?Configura DEMO_ROOT_PASSWORD en .env}
    networks:
      - dbshield-net

networks:
  dbshield-net:
    driver: bridge # Red interna compartida y aislada del exterior

volumes:
  proxy-events:
  internal-db-data:
    driver: local

